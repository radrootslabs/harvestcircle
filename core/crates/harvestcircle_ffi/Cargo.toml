[package]
name = "harvestcircle_ffi"
description = "Private native FFI boundary for HarvestCircle"
version = "0.1.0-alpha"
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
license = "GPL-3.0-only"
repository.workspace = true
homepage.workspace = true
publish = false
build = "build.rs"
include = ["build.rs", "src/**", "uniffi.toml", "Cargo.toml"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
directories = "=6.0.0"
harvestcircle_application.workspace = true
harvestcircle_domain.workspace = true
harvestcircle_nostr.workspace = true
harvestcircle_product.workspace = true
harvestcircle_runtime.workspace = true
harvestcircle_storage.workspace = true
radroots_runtime_paths.workspace = true
radroots_service_sqlite.workspace = true
tokio = { version = "=1.47.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
uniffi = "=0.32.0"

[build-dependencies]
harvestcircle_product.workspace = true
quote.workspace = true
sha2.workspace = true
syn.workspace = true

[dev-dependencies]
nostr = { git = "https://github.com/rust-nostr/nostr.git", rev = "5bba5163eb77107f82c4a8262cf29d7f33a73219", package = "nostr" }
nostr-relay-builder = { git = "https://github.com/rust-nostr/nostr.git", rev = "5bba5163eb77107f82c4a8262cf29d7f33a73219", package = "nostr-relay-builder" }
nostr-sdk = { git = "https://github.com/rust-nostr/nostr.git", rev = "5bba5163eb77107f82c4a8262cf29d7f33a73219", package = "nostr-sdk" }
tempfile = "=3.23.0"

[lints]
workspace = true
