[package]
name = "harvestcircle_storage"
description = "Private persistence and keyring adapters for HarvestCircle"
version = "0.1.0-alpha"
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
license = "GPL-3.0-only"
repository.workspace = true
homepage.workspace = true
publish = false
include = ["src/**", "tests/**", "Cargo.toml"]

[dependencies]
keyring = "=4.1.6"
harvestcircle_application.workspace = true
harvestcircle_domain.workspace = true
harvestcircle_product.workspace = true
radroots_runtime_paths.workspace = true
radroots_service_sqlite.workspace = true
radroots_storage.workspace = true
sqlx.workspace = true
getrandom.workspace = true
zeroize = "=1.9.0"

[dev-dependencies]
harvestcircle_nostr.workspace = true
tempfile = "=3.23.0"
tokio = { version = "=1.47.1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
