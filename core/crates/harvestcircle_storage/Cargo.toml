[package]
name = "harvestcircle_storage"
description = "Private persistence and keyring adapters for HarvestCircle"
version = "0.1.0-alpha"
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
license = "GPL-3.0-only"
repository.workspace = true
homepage.workspace = true
publish = false
include = ["src/**", "tests/**", "Cargo.toml"]

[dependencies]
harvestcircle_application.workspace = true
harvestcircle_domain.workspace = true
harvestcircle_product.workspace = true
radroots_event = { workspace = true, features = ["std"] }
radroots_event_codec = { workspace = true, features = ["std", "json"] }
radroots_runtime_paths.workspace = true
radroots_service_sqlite.workspace = true
radroots_storage.workspace = true
sqlx.workspace = true
getrandom.workspace = true
zeroize = "=1.9.0"

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "=5.1.0", features = ["rt-tokio-crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=3.7.0"
security-framework-sys = "=2.17.0"

[dev-dependencies]
harvestcircle_nostr.workspace = true
nostr = { git = "https://github.com/rust-nostr/nostr.git", rev = "5bba5163eb77107f82c4a8262cf29d7f33a73219", package = "nostr" }
tempfile = "=3.23.0"
tokio = { version = "=1.47.1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
