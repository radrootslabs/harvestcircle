[workspace]
members = [
    "crates/application",
    "crates/domain",
    "crates/ffi",
    "crates/nostr",
    "crates/storage",
    "tools/uniffi-bindgen",
]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.0"
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-only"
repository = "https://github.com/radroots/studio_app"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
