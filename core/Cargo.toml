[workspace]
members = [
  "crates/harvestcircle_application",
  "crates/harvestcircle_domain",
  "crates/studio_ffi",
  "crates/studio_nostr",
  "crates/harvestcircle_preferences",
  "crates/studio_runtime",
  "crates/harvestcircle_storage",
  "crates/studio_uniffi_bindgen",
]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha"
edition = "2024"
rust-version = "1.97.1"
license = "GPL-3.0-only"
repository = "https://github.com/radrootslabs/studio_app"
homepage = "https://radroots.org"
authors = ["Tyson Lupul <tyson@radroots.org>"]

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.dependencies]
harvestcircle_application = { path = "crates/harvestcircle_application", version = "=0.1.0-alpha" }
harvestcircle_domain = { path = "crates/harvestcircle_domain", version = "=0.1.0-alpha" }
radroots_studio_ffi = { path = "crates/studio_ffi", version = "=0.1.0-alpha" }
radroots_studio_nostr = { path = "crates/studio_nostr", version = "=0.1.0-alpha" }
harvestcircle_preferences = { path = "crates/harvestcircle_preferences", version = "=0.1.0-alpha" }
radroots_studio_runtime = { path = "crates/studio_runtime", version = "=0.1.0-alpha" }
harvestcircle_storage = { path = "crates/harvestcircle_storage", version = "=0.1.0-alpha" }
radroots_studio_uniffi_bindgen = { path = "crates/studio_uniffi_bindgen", version = "=0.1.0-alpha" }
radroots_identity = { git = "https://github.com/radrootslabs/lib", rev = "09065a610d95e57acdc895a14c07580fa099e7c3", version = "=0.1.0-alpha", default-features = false }
radroots_transport = { git = "https://github.com/radrootslabs/lib", rev = "09065a610d95e57acdc895a14c07580fa099e7c3", version = "=0.1.0-alpha", default-features = false }
radroots_transport_nostr = { git = "https://github.com/radrootslabs/lib", rev = "09065a610d95e57acdc895a14c07580fa099e7c3", version = "=0.1.0-alpha", default-features = false }
getrandom = { version = "0.2", default-features = false }
hmac = { version = "0.12", default-features = false }
quote = { version = "1" }
rustix = { version = "1", features = ["fs", "process", "std"] }
sha2 = { version = "0.10", default-features = false }
syn = { version = "2", features = ["full", "parsing", "visit", "visit-mut"] }
uuid = { version = "1.22.0", features = ["v4", "v7"] }
