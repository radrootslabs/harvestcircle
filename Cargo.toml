[workspace]
members = [
    "crates/runtime",
    "crates/i18n",
    "crates/types",
    "crates/view",
    "crates/signer",
    "crates/store",
    "crates/state",
    "crates/sync",
    "crates/ui",
    "crates/desktop",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Radroots Authors"]
rust-version = "1.97.1"
license = "GPL-3.0-or-later"
repository = "https://github.com/radrootslabs/studio_app"
homepage = "https://radroots.org"
readme = "README.md"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures-executor = "0.3"
futures-util = "0.3"
gpui = "0.2.2"
gpui-component = "0.5.1"
gpui-component-assets = "0.5.1"
mf2_i18n = { version = "=0.1.0", git = "https://github.com/triesap/mf2_i18n.git", rev = "e95f0fe090764dc62f5f67f4ff9e207d7e1cd901", default-features = false }
nostr = "0.44.2"
radroots_core = { version = "=0.1.0-alpha", path = "../lib/crates/core", default-features = false, features = ["std"] }
radroots_authority = { version = "=0.1.0-alpha", path = "../lib/crates/authority" }
radroots_event = { version = "=0.1.0-alpha", path = "../lib/crates/event", default-features = false, features = ["serde", "std"] }
radroots_event_codec = { version = "=0.1.0-alpha", path = "../lib/crates/event_codec", features = ["json"] }
radroots_identity = { version = "=0.1.0-alpha", path = "../lib/crates/identity" }
radroots_runtime_store = { version = "=0.1.0-alpha", path = "../lib/crates/runtime_store", features = ["native"] }
radroots_nostr = { version = "=0.1.0-alpha", path = "../lib/crates/nostr", features = ["client"] }
radroots_nostr_accounts = { version = "=0.1.0-alpha", path = "../lib/crates/nostr_accounts" }
radroots_nostr_connect = { version = "=0.1.0-alpha", path = "../lib/crates/nostr_connect" }
radroots_protected_store = { version = "=0.1.0-alpha", path = "../lib/crates/protected_store" }
radroots_runtime_paths = { version = "=0.1.0-alpha", path = "../lib/crates/runtime_paths" }
radroots_secret_vault = { version = "=0.1.0-alpha", path = "../lib/crates/secret_vault", default-features = false, features = ["std"] }
radroots_sdk = { version = "=0.1.0-alpha", path = "../sdk/crates/sdk", features = ["local-runtime"] }
radroots_sql_core = { version = "=0.1.0-alpha", path = "../lib/crates/sql_core", features = ["native"] }
radroots_trade = { version = "=0.1.0-alpha", path = "../lib/crates/trade", default-features = false, features = ["std", "serde", "serde_json"] }
radroots_studio_app_core = { path = "crates/runtime", version = "0.1.0" }
radroots_studio_app_i18n = { path = "crates/i18n", version = "0.1.0" }
radroots_studio_app_types = { path = "crates/types", version = "0.1.0" }
radroots_studio_app_view = { path = "crates/view", version = "0.1.0" }
radroots_studio_app_sqlite = { path = "crates/store", version = "0.1.0" }
radroots_studio_app_state = { path = "crates/state", version = "0.1.0" }
radroots_studio_app_sync = { path = "crates/sync", version = "0.1.0" }
radroots_studio_app_ui = { path = "crates/ui", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9.0", default-features = false, features = ["derive", "sqlite-bundled"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt", "sync"] }
tokio-tungstenite = "0.26.2"
toml = "0.8"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["serde", "v5", "v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"
