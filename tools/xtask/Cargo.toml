[package]
name = "harvestcircle_xtask"
version = "0.1.0-alpha"
edition = "2024"
rust-version = "1.99.0"
license = "GPL-3.0-only"
publish = false

[workspace]

[dependencies]
syn = { version = "2", features = ["full", "visit"] }
toml = "1.1.4"
harvestcircle_product = { path = "../../core/crates/harvestcircle_product" }
libc = "0.2.189"
sha2 = "0.10.9"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
